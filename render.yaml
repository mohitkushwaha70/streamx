services:
  - type: web
    name: streamx
    runtime: node
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: "/"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        sync: false
      - key: VIDEO_STORAGE_BASE
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        sync: false
