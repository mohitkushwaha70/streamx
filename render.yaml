services:
  - type: web
    name: streamx
    runtime: node
    buildCommand: "npm install --no-audit"
    startCommand: "node server.js"
    healthCheckPath: "/"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
